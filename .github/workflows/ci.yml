name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -cover ./...

  e2e:
    name: End-to-end (docker compose)
    runs-on: ubuntu-latest

    env:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      BAO_ROOT_TOKEN: root

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start the stack
        run: docker compose up -d --build --wait clickhouse openbao

      - name: Configure the database secrets engine
        run: docker compose run --rm configure

      - name: Issue a credential and use it against ClickHouse
        run: |
          set -euo pipefail

          creds=$(docker compose exec -T openbao \
            bao read -format=json database/creds/readonly)

          username=$(jq -r '.data.username' <<<"$creds")
          password=$(jq -r '.data.password' <<<"$creds")
          lease_id=$(jq -r '.lease_id' <<<"$creds")

          test -n "$username" && test "$username" != "null"
          test -n "$password" && test "$password" != "null"
          echo "Issued credential for user $username"

          # The dynamic user must be able to read from the granted database.
          docker compose exec -T clickhouse clickhouse-client \
            --user "$username" --password "$password" --query "SELECT 1"

          # And must lose access once the lease is revoked. Revocation is
          # queued asynchronously, so poll rather than checking once.
          docker compose exec -T openbao bao lease revoke "$lease_id"

          for _ in $(seq 1 15); do
            if ! docker compose exec -T clickhouse clickhouse-client \
                 --user "$username" --password "$password" --query "SELECT 1" \
                 >/dev/null 2>&1; then
              echo "Revocation dropped user $username"
              exit 0
            fi
            sleep 1
          done

          echo "revoked user $username can still authenticate" >&2
          exit 1

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
