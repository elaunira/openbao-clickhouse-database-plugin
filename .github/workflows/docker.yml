name: Docker

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      openbao_version:
        description: OpenBao base image version
        required: false
        default: '2.4.4'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEFAULT_OPENBAO_VERSION: '2.4.4'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: default
            suffix: ''
          - flavour: ubi
            suffix: '-ubi'

    steps:
      - uses: actions/checkout@v6

      - name: Resolve OpenBao version
        id: openbao
        run: echo "version=${{ inputs.openbao_version || env.DEFAULT_OPENBAO_VERSION }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=openbao-clickhouse
            org.opencontainers.image.description=OpenBao with the ClickHouse database secrets plugin preinstalled

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.flavour }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENBAO_VERSION=${{ steps.openbao.outputs.version }}
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('v0.0.0-{0}', github.sha) }}
          cache-from: type=gha,scope=${{ matrix.flavour }}
          cache-to: type=gha,scope=${{ matrix.flavour }},mode=max
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the plugin is present and runnable
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}:sha-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          docker run --rm --entrypoint sh "$image" -c \
            'test -x /openbao/plugins/clickhouse-database-plugin && echo "plugin OK"'
